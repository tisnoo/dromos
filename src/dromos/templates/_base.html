<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Dromos{% endblock %}</title>
<style>
  :root {
    color-scheme: light;
    --page: #f3f2ef;
    --surface: #fcfcfb;
    --border: #e4e2dc;
    --text: #0b0b0b;
    --text-2: #52514e;
    --text-3: #75736e;
    --grid: #e9e7e2;
    --series-1: #2a78d6;
    --reference: #52514e;
    --band: #e6e4de;
    --good: #0ca30c;
    --button: #0b0b0b;
    --button-text: #fcfcfb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #121211;
      --surface: #1a1a19;
      --border: #2e2e2c;
      --text: #ffffff;
      --text-2: #c3c2b7;
      --text-3: #9b9a91;
      --grid: #2a2a28;
      --series-1: #3987e5;
      --reference: #c3c2b7;
      --band: #383835;
      --button: #ffffff;
      --button-text: #1a1a19;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #121211; --surface: #1a1a19; --border: #2e2e2c; --text: #ffffff;
    --text-2: #c3c2b7; --text-3: #9b9a91; --grid: #2a2a28; --series-1: #3987e5;
    --reference: #c3c2b7; --band: #383835; --button: #ffffff; --button-text: #1a1a19;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .muted { color: var(--text-2); }
  .small { font-size: 13px; }
  button, .button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px;
                    border: 0; background: var(--button); color: var(--button-text);
                    cursor: pointer; text-decoration: none; display: inline-block; }
  button.quiet { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
