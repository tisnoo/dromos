[project]
name = "dromos"
version = "0.1.0"
description = "A training plan that adapts to you"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.20",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dromos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
